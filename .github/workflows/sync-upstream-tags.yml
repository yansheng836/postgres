name: Sync Upstream Tags

on:
  workflow_dispatch:  # 允许手动触发
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨2点自动同步（可选）

permissions:
  contents: write

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        #branch: [master, gitstats-report]
        branch: [master]

    steps:
      - name: Checkout current branch (${{ matrix.branch }})
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0  # 获取完整历史记录，包括所有tag
          token: ${{ secrets.SYNC_TOKEN }}  # PAT 带 repo + workflow

      - name: Configure Git
        run: |
          git config user.name "yansheng836bot"
          git config user.email "yansheng836bot@163.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/postgres/postgres.git || true
          git fetch upstream --tags

      - name: Sync all upstream tags
        run: |
          # 拉取上游全部 tag（含 annotated tag 对象），--force 覆盖本地已存在但指向不一致的同名 tag
          git fetch upstream --tags --force
          # 原样推送到 origin，tag 指向上游真正的 commit
          git push origin --tags

      - name: Update branch to latest upstream
        run: |
          # 将当前分支更新到上游最新状态
          git fetch upstream ${{ matrix.branch }}
          git merge --ff-only upstream/${{ matrix.branch }} || echo "Fast-forward not possible, skipping merge"
          git push origin ${{ matrix.branch }}
